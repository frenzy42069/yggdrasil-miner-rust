[package]
name = "yggdrasil-vanity"
version = "0.1.0"
edition = "2024"
description = "Vanity address generator for the Yggdrasil network"
authors = ["Alexander Averyanov <alex@averyan.ru>"]
readme = "README.md"
repository = "https://github.com/averyanalex/yggdrasil-vanity"
license = "BSD-2-Clause"

[dependencies]
# TODO: disable-default
clap = { version = "4.6.6", features = ["derive", "cargo"] }
rand = "0.10.2"
hex = "0.4.3"
ocl = "0.19.7"
rayon = "1.12.0"
chrono = "0.4.45"
ed25519-dalek = "2.0.0-rc.3" # 3.0.0
