[package]
name = "yggdrasil-vanity"
version = "0.1.0"
edition = "2024"
description = "Vanity address generator for the Yggdrasil network"
authors = ["Alexander Averyanov <alex@averyan.ru>"]
readme = "README.md"
repository = "https://github.com/averyanalex/yggdrasil-vanity"
license = "BSD-2-Clause"

[profile.release]
lto = "thin"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["now"]}
clap = { version = "4.6.6", default-features = false, features = ["std", "derive", "cargo"] }
ed25519-dalek = { version = "3.0.0", default-features = false}
hex = { version = "0.4.3", default-features = false, features = ["alloc"]}
ocl = { version = "0.19.7", default-features = false }
rand = { version = "0.10.2", default-features = false, features = ["thread_rng"] }
rayon = { version = "1.12.0", default-features = false }

[lints.clippy]
complexity = "warn"
nursery = "warn"
pedantic = "warn"
perf = "warn"
suspicious = "warn"
